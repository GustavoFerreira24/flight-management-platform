persistence.repositoryFactory=isep.aisafe.persistence.impl.jpa.JpaRepositoryFactory
persistence.persistenceUnit=aisafePU

# RCOMP remote access uses the same remote database as the backoffice application.
# Keep schema generation disabled after the database has been bootstrapped.
jakarta.persistence.schema-generation.database.action=none
jakarta.persistence.jdbc.driver=org.h2.Driver
jakarta.persistence.jdbc.url=jdbc:h2:tcp://vsgate-s2.dei.isep.ipp.pt:10420/aisafe
jakarta.persistence.jdbc.user=sa
jakarta.persistence.jdbc.password=

eclipselink.logging.level=INFO
eclipselink.jdbc.connection_pool.default.initial=2
eclipselink.jdbc.connection_pool.default.min=2
eclipselink.jdbc.connection_pool.default.max=10
